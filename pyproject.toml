[project]
name = "statistical-learning-samples"
version = "0.1.0"
description = "Timed practice tasks for applied statistics / ML interview prep"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas (>=2.2)",
    "numpy (>=1.26)",
    "scikit-learn (>=1.4)",
    "xgboost (>=2.0)",
    "shap (>=0.45)",
    "matplotlib (>=3.8)",
    "seaborn (>=0.13)",
    "jupyter (>=1.0)",
    "ipykernel (>=6.29)",
    "nbconvert (>=7.16)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
